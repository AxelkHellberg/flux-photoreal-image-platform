[project]
name = "image-platform-worker"
version = "0.1.0"
description = "GPU worker for the image platform"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate>=1.5.2",
  "diffusers>=0.33.1",
  "image-platform-shared",
  "huggingface-hub>=0.31.1",
  "safetensors>=0.5.3",
  "torch>=2.6.0,<2.7.0",
  "transformers>=4.51.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4"
]

[tool.uv.sources]
image-platform-shared = { workspace = true }

[build-system]
requires = ["setuptools>=75.6.0"]
build-backend = "setuptools.build_meta"
