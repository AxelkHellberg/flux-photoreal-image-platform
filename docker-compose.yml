services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: image_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data:/data

  minio-bootstrap:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      - minio
    entrypoint: >-
      /bin/sh -c '
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done &&
      mc mb --ignore-existing local/image-platform-images &&
      mc anonymous set download local/image-platform-images || true
      '

  api:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    command: >-
      /bin/sh -lc "uv run --package image-platform-api alembic -c apps/api/alembic.ini upgrade head && uv run --package image-platform-api uvicorn image_platform_api.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/image_platform
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: image-platform-images
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PUBLIC_BASE_URL: http://localhost:9002/image-platform-images
      STORAGE_BACKEND: s3
      IMAGE_GENERATOR_BACKEND: stub
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_API_BASE_URL: http://localhost:18000
    depends_on:
      - postgres
      - redis
      - minio-bootstrap
    ports:
      - "18000:8000"

  worker:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    command: uv run --package image-platform-worker python -m image_platform_worker.main
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/image_platform
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: image-platform-images
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_PUBLIC_BASE_URL: http://localhost:9002/image-platform-images
      STORAGE_BACKEND: s3
      IMAGE_GENERATOR_BACKEND: stub
      WORKER_ID: worker-compose
    depends_on:
      - api

  reaper:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    command: uv run --package image-platform-api python -m image_platform_api.reaper
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/image_platform
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: image-platform-images
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      REAPER_INTERVAL_SECONDS: 10
    depends_on:
      - api

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:18000
    ports:
      - "13000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
