[project]
name = "image-platform-shared"
version = "0.1.0"
description = "Shared backend primitives for the image platform"
requires-python = ">=3.10,<3.13"
dependencies = [
  "boto3>=1.35.99",
  "pillow>=11.1.0",
  "psycopg[binary]>=3.2.3",
  "pydantic-settings>=2.7.1",
  "pydantic>=2.10.4",
  "redis>=5.2.1",
  "sqlalchemy>=2.0.36",
  "structlog>=24.4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4"
]

[build-system]
requires = ["setuptools>=75.6.0"]
build-backend = "setuptools.build_meta"
