[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "ruff>=0.8.6"
]

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/worker",
  "packages/shared/python",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = [
  "apps/api/src",
  "apps/worker/src",
  "packages/shared/python/src",
]
testpaths = [
  "apps/api/tests",
  "apps/worker/tests",
]
